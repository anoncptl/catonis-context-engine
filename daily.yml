name: Context Engine

on:
  schedule:
    # GitHub runs on UTC and ignores daylight saving, so every slot fires twice.
    # The engine checks the real Vienna or New York time and only runs once per slot.
    - cron: "30 5 * * 1-5"    # morning slot (07:00 Vienna in winter)
    - cron: "30 6 * * 1-5"    # morning slot (summer twin)
    - cron: "40 12 * * 1-5"   # pre-open slot (08:40 New York in summer)
    - cron: "40 13 * * 1-5"   # pre-open slot (08:40 New York in winter)
    - cron: "30 21 * * 1-5"   # evening slot (17:30 New York in summer)
    - cron: "30 22 * * 1-5"   # evening slot (17:30 New York in winter)
  workflow_dispatch: {}       # adds the "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: context-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python context_engine.py
          else
            python context_engine.py --scheduled
          fi
          [ -f site/index.html ] || python context_engine.py --site

      - name: Save memory and briefs to the repository
        run: |
          git config user.name "context-engine-bot"
          git config user.email "context-engine-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Context Engine run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
