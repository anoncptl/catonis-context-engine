name: Context Engine

on:
  schedule:
    # Backup only. The main trigger is a scheduled task that starts this workflow at 08:30 New York
    # (14:30 CET). GitHub's own timer is unreliable, so it fires a few times around then; the engine
    # runs once per weekday and every later firing exits in seconds.
    - cron: "30,50 12-14 * * 1-5"
    - cron: "10 13-15 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "manual = always run now; scheduled = daily run (skipped if it already ran today); publish = only republish the website from saved data"
        required: false
        default: "manual"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: context-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the engine
        id: engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.mode }}" = "publish" ]; then
            python context_engine.py --site
            echo "ran=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" != "scheduled" ]; then
            python context_engine.py
          else
            python context_engine.py --scheduled
          fi

      - name: Save memory and briefs to the repository
        if: steps.engine.outputs.ran == 'true'
        run: |
          git config user.name "context-engine-bot"
          git config user.email "context-engine-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Context Engine run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi

      - if: steps.engine.outputs.ran == 'true'
        uses: actions/configure-pages@v5
      - if: steps.engine.outputs.ran == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.engine.outputs.ran == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry publishing if GitHub had a hiccup
        if: steps.engine.outputs.ran == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 45
      - if: steps.engine.outputs.ran == 'true' && steps.deploy.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-retry
      - id: deploy_retry
        if: steps.engine.outputs.ran == 'true' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-retry
