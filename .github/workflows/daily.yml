name: Context Engine

on:
  schedule:
    # GitHub sometimes drops scheduled runs, so this fires every 30 minutes on weekdays.
    # The engine only does work inside its three slots (about 06:30, 14:40 and 23:30 Vienna)
    # and only once per slot per day. Every other firing exits in seconds and publishes nothing.
    - cron: "10,40 5-23 * * 1-5"
  workflow_dispatch: {}       # adds the "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: context-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the engine
        id: engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python context_engine.py
          else
            python context_engine.py --scheduled
          fi

      - name: Save memory and briefs to the repository
        if: steps.engine.outputs.ran == 'true'
        run: |
          git config user.name "context-engine-bot"
          git config user.email "context-engine-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Context Engine run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi

      - if: steps.engine.outputs.ran == 'true'
        uses: actions/configure-pages@v5
      - if: steps.engine.outputs.ran == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.engine.outputs.ran == 'true'
        uses: actions/deploy-pages@v4
